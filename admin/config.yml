fields:
  - {label: "Product Name", name: "title", widget: "string"}

  - {label: "Price (PKR)", name: "price", widget: "string"}

  - label: "Category"
    name: "category"
    widget: "select"
    options:
      - "Phone Cases"
      - "Home Use"
      - "Clothing"
      - "Lifestyle"
      - "Electronics"
      - "Beauty"

  - {label: "Product Image", name: "image", widget: "image"}

  - {label: "Description", name: "body", widget: "markdown"}
